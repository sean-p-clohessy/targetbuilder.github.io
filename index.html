<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Target Builder — SMART goals</title>
    <style>
      :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;line-height:1.4;color:#111}
      body{max-width:42rem;margin:4rem auto;padding:1rem}
      header h1{margin:0 0 .25rem}
      .lead{color:#555;margin-top:0}
      .card{border:1px solid #e6e6e6;padding:1rem;border-radius:8px;background:#fafafa}
      a.button{display:inline-block;margin-top:1rem;padding:.5rem .75rem;border-radius:6px;background:#0366d6;color:white;text-decoration:none}
    </style>
  </head>
  <body>
    <header>
      <h1>Target Builder</h1>
      <p class="lead">A simple SMART target builder</p>
    </header>

    <main>
      <section class="card">
        <p>This site helps you create SMART goals (Specific, Measurable, Achievable, Relevant, Time-bound).</p>
        <p>Click the button below to get started building a target.</p>
        <a class="button" href="#">Start building</a>
      </section>

      <section style="margin-top:1rem;color:#666;font-size:.9rem">
        <p>Repository: <a href="https://github.com/sean-p-clohessy/targetbuilder.github.io">sean-p-clohessy/targetbuilder.github.io</a></p>
      </section>
    </main>

    <footer style="margin-top:2rem;color:#999;font-size:.85rem">&copy; 2026 Target Builder</footer>
  </body>
</html>
